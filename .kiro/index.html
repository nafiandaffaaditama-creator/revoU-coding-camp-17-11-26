<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Start Page</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- ───────────── HEADER ───────────── -->
    <header class="top-bar">
      <span id="clock" class="clock"></span>
      <button id="theme-toggle" class="icon-btn" title="Toggle light/dark mode">🌙</button>
    </header>

    <main class="container">

      <!-- ───────────── GREETING ───────────── -->
      <section class="card greeting-card">
        <p id="greeting" class="greeting-text"></p>
        <p id="date-display" class="date-text"></p>
        <div class="name-row">
          <input id="name-input" type="text" placeholder="Enter your name…" maxlength="40" />
          <button id="name-save-btn" class="btn btn-primary">Save</button>
        </div>
      </section>

      <!-- ───────────── FOCUS TIMER ───────────── -->
      <section class="card timer-card">
        <h2 class="section-title">Focus Timer</h2>

        <div class="timer-duration-row">
          <label for="timer-minutes">Duration (min):</label>
          <input id="timer-minutes" type="number" min="1" max="120" value="25" />
        </div>

        <div id="timer-display" class="timer-display">25:00</div>

        <div class="timer-controls">
          <button id="timer-start" class="btn btn-primary">Start</button>
          <button id="timer-stop"  class="btn btn-secondary">Stop</button>
          <button id="timer-reset" class="btn btn-ghost">Reset</button>
        </div>
      </section>

      <!-- ───────────── TO-DO LIST ───────────── -->
      <section class="card todo-card">
        <h2 class="section-title">To-Do List</h2>

        <div class="todo-add-row">
          <input id="todo-input" type="text" placeholder="Add a task…" maxlength="120" />
          <button id="todo-add-btn" class="btn btn-primary">Add</button>
        </div>

        <div class="todo-toolbar">
          <span id="todo-count" class="todo-count"></span>
          <div class="sort-row">
            <label for="todo-sort">Sort:</label>
            <select id="todo-sort">
              <option value="none">None</option>
              <option value="az">A → Z</option>
              <option value="za">Z → A</option>
              <option value="done">Done last</option>
            </select>
          </div>
        </div>

        <ul id="todo-list" class="todo-list"></ul>
      </section>

      <!-- ───────────── QUICK LINKS ───────────── -->
      <section class="card links-card">
        <h2 class="section-title">Quick Links</h2>

        <div class="link-add-row">
          <input id="link-name-input" type="text" placeholder="Label"  maxlength="30" />
          <input id="link-url-input"  type="url"  placeholder="https://…" maxlength="200" />
          <button id="link-add-btn" class="btn btn-primary">Add</button>
        </div>

        <div id="links-grid" class="links-grid"></div>
      </section>

    </main>

    <script src="js/app.js"></script>
  </body>
</html>
